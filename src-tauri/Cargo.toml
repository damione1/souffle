[workspace]
members = [".", "souffle-mcp", "souffle-schema", "souffle-slint", "tts-fixtures"]

# The contract rule from AGENTS.md, made mechanical: a `_ =>` arm that covers
# enum variants is exactly the pattern the rule forbids, and clippy already
# knows how to spot it. The lint lives in `restriction`, so it is off by
# default and has to be asked for. Denying it here means `cargo clippy` picks
# it up locally and in CI without either changing its command line.
#
# Where the fallback genuinely is the semantics (a foreign `non_exhaustive`
# enum, or a transition table that would need 10 states by 12 actions), the
# site carries a commented `#[allow]` rather than the lint being weakened.
[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"

[package]
name = "souffle"
# Placeholder. The release workflow rewrites this line from the release tag, so
# a version still reading 0.0.0 at compile time means the binary was built from
# a checkout rather than cut from a tag. `update_check::current_version` turns
# that into "local build".
version = "0.0.0"
description = "Local speech-to-text desktop application"
authors = ["Damien Goehrig"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "souffle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "native_paste_main_thread"
path = "tests/native_paste_main_thread.rs"
harness = false

[lints]
workspace = true

[dependencies]
souffle-schema = { path = "souffle-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
tracing-appender = "0.2"
log = "0.4"
crossbeam-channel = "0.5"
# 0.16 disposes the CoreAudio AudioUnit on Stream drop (0.15 leaked it and
# left Bluetooth headsets in HFP/mono). 0.16 also had a release-mode UB in
# device enumeration (`let data_size = 0` then read it back) that SIGSEGV'd
# at 0x4 on session start; 0.17 fixed that ("segfaults when enumerating
# devices").
cpal = "0.17"
rubato = "0.16"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dirs-next = "2"
libc = "0.2"
clap = { version = "4", features = ["derive"] }

# Phase 2: Kyutai STT inference
candle-core = { version = "0.9.1", features = ["metal"] }
candle-nn = { version = "0.9.1", features = ["metal"] }
candle-transformers = "0.9.1"
moshi = "0.6.1"
sentencepiece = "0.11.3"
hf-hub = "0.4.3"
memmap2 = "0.9"
safetensors = "0.7"
reqwest = { version = "0.12", features = ["stream", "blocking"] }
futures-util = "0.3"
sha2 = "0.10"

# Phase 6: Whisper engine via whisper.cpp
whisper-rs = { version = "0.16", features = ["metal", "tracing_backend"] }

# Phase 4: SQLite unified storage
rusqlite = { version = "0.33", features = ["bundled-full"] }
# Accent folding for snippet trigger uniqueness (SOU-035), mirrors the
# NFD + strip-marks fold the frontend matcher applies.
unicode-normalization = "0.1"

# Pipeline quality filters + Parakeet (all share the bundled ONNX Runtime
# dylib via ort load-dynamic — never link onnxruntime statically here, its
# protobuf copy corrupts sentencepiece's; see commit 508f3a4)
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false, features = ["load-dynamic"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic"] }
parakeet-rs = { version = "=0.3.6", default-features = false, features = ["load-dynamic"] }
strsim = "0.11"
regex = "1"

# Phase 3: Clipboard/paste + Ollama
arboard = "3"
enigo = { version = "0.3", features = ["serde"] }

# System audio capture via Core Audio process taps (macOS 14.4+) + echo cancellation
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
# Calendar integration (read-only EventKit access)
objc2-event-kit = "0.3"
# Microphone TCC status (AVCaptureDevice.authorizationStatus), no prompt.
# default-features off plus a minimal feature list keeps this from pulling
# in the rest of AVFoundation (asset reading/writing, capture sessions, ...)
# that this app never touches.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "AVCaptureDevice",
    "AVMediaFormat",
    "block2",
] }
# Sleep/wake observers (NSWorkspace notifications)
objc2-app-kit = "0.3"
ringbuf = "0.5"
block2 = "0.6"
dispatch2 = "0.3"

# Meeting audio recording: Opus encoding (statically linked on macOS via
# audiopus_sys — pkg-config finds a static libopus.a if present, otherwise
# audiopus_sys builds vendored libopus via cmake, but either way the result
# is statically linked, so no libopus.dylib ships in the bundle) into an Ogg
# container.
opus = "0.3"
ogg = "0.9"
core-graphics = "0.25.0"
core-foundation = "0.10.1"
objc2-service-management = "0.3"
fdaf-aec = "0.1.0"
# SOU-191: native replacements for the removed Tauri plugins. global-hotkey
# and tray-icon (with muda for the menu) are the same crates tauri's own
# `global-shortcut` plugin and `tray-icon` feature wrap internally — used
# directly instead of through Tauri's plugin/feature layer.
global-hotkey = "0.6"
# Pinned to a version resolving to exactly muda 0.19.3: i-slint-backend-selector
# unconditionally requests `i-slint-backend-winit`'s "muda" feature (Slint's
# own native menu-bar support), so *some* muda 0.19.3 is in this dependency
# tree no matter what. tray-icon versions before 0.23 and 0.25+ resolve to a
# different, semver-incompatible muda (0.15-0.17, then 0.20), so both copies
# try to register an Objective-C class named "MudaMenuItem" and the second
# one crashes the process ("could not create new class ... perhaps a class
# with that name already exists"). Found by actually launching the bundled
# binary, not by cargo test/clippy — neither runs the real AppKit event loop
# far enough to reach tray setup.
tray-icon = ">=0.23, <0.25"
objc2-user-notifications = "0.3"
minisign-verify = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"

[features]
default = ["private-tcc"]

# Exposes the mock transcription engine (normally `#[cfg(test)]`-only) so the
# `tests/` integration binaries — which link the lib as a normal, non-`cfg(test)`
# dependency — can use it too. Enabled automatically for `cargo test` via the
# self dev-dependency below. Must not gate anything that itself needs a
# dev-dependency (e.g. `tempfile`): dev-dependencies aren't available when the
# lib is built as a dependency, even via this self-reference.
test-support = []

# `TCCAccessPreflight` is an SPI: there is no public API to read the system
# audio capture permission, and Apple can drop the symbol. On means the status
# is read by XPC to tccd; off (or a `dlsym` miss at runtime) falls back to
# mounting a short-lived tap, which answers the same question by doing the
# thing.
private-tcc = []

[dev-dependencies]
tempfile = "3"
souffle-mcp = { path = "souffle-mcp" }
souffle = { path = ".", features = ["test-support"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
# Unwind (not abort) so a panic on a pipeline worker thread can be caught at
# the thread/FFI boundary and recovered, instead of SIGABRT-ing the whole app.
# Every C->Rust callback (cpal/tap) is wrapped in catch_unwind so no panic
# unwinds across the FFI boundary (which would be UB).
panic = "unwind"
