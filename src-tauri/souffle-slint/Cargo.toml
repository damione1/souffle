[package]
name = "souffle-slint"
version = "0.0.0"
description = "Standalone Slint UI shell for Souffle, without Tauri"
authors = ["Damien Goehrig"]
license = "GPL-3.0-or-later"
edition = "2024"

[[bin]]
name = "souffle-slint"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
slint = "1.9"
souffle_lib = { path = "..", package = "souffle" }
chrono = "0.4"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"
# SOU-187 milestone 7: native audio playback for MeetingDetail (AC14/AC16).
# Same version already used by the main `souffle` crate for capture.
cpal = "0.17"
# SOU-187 documented exception to SOU-186 AC9 ("zero tauri* in this crate's
# tree"): the recording backend is built on tauri::State/AppHandle, so the
# headless bridge needs the `Manager` trait here too. Closed by SOU-191.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png", "protocol-asset"] }
# SOU-188: native clipboard write for "Copy diagnostics" - same crate/version
# the main `souffle` crate already uses (src/clipboard.rs), no webview
# clipboard API to fall back on here.
arboard = "3.6"
# SOU-188: new custom summary-template/dictionary-entry/snippet ids, same
# crate/version the main `souffle` crate already uses (src/state.rs).
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.9"
