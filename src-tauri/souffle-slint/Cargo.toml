[package]
name = "souffle-slint"
version = "0.0.0"
description = "Standalone Slint UI shell for Souffle, without Tauri"
authors = ["Damien Goehrig"]
license = "GPL-3.0-or-later"
edition = "2024"

[[bin]]
name = "souffle-slint"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# `unstable-winit-030`: lets main.rs configure the native NSWindow (hidden
# title, transparent titlebar, full-size content view) via
# `slint::BackendSelector::with_winit_window_attributes_hook` before the
# window is created - the native-window equivalent of Tauri's
# `titleBarStyle: overlay` + `hiddenTitle: true`, needed so the app draws one
# custom dark header with inline traffic lights instead of a native title
# bar stacked on top of it.
slint = { version = "1.9", features = ["unstable-winit-030"] }
souffle_lib = { path = "..", package = "souffle" }
chrono = "0.4"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"
# SOU-187 milestone 7: native audio playback for MeetingDetail (AC14/AC16).
# Same version already used by the main `souffle` crate for capture.
cpal = "0.17"
# SOU-191: receives NativeAction from souffle_lib::native::bridge (global
# shortcuts, tray, pill HUD stop, single-instance, background update check).
crossbeam-channel = "0.5"
# SOU-188: native clipboard write for "Copy diagnostics" - same crate/version
# the main `souffle` crate already uses (src/clipboard.rs), no webview
# clipboard API to fall back on here.
arboard = "3.6"
# SOU-188: new custom summary-template/dictionary-entry/snippet ids, same
# crate/version the main `souffle` crate already uses (src/state.rs).
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
lucide-slint = "1.46.0"
slint-build = "1.9"
