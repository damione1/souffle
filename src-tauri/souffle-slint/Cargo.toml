[package]
name = "souffle-slint"
version = "0.0.0"
description = "Standalone Slint UI shell for Souffle, without Tauri"
authors = ["Damien Goehrig"]
license = "GPL-3.0-or-later"
edition = "2024"

[[bin]]
name = "souffle-slint"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
slint = "1.9"
souffle_lib = { path = "..", package = "souffle" }
chrono = "0.4"
# SOU-187 documented exception to SOU-186 AC9 ("zero tauri* in this crate's
# tree"): the recording backend is built on tauri::State/AppHandle, so the
# headless bridge needs the `Manager` trait here too. Closed by SOU-191.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png", "protocol-asset"] }

[build-dependencies]
slint-build = "1.9"
