[package]
name = "souffle-slint"
version = "0.0.0"
description = "Standalone Slint UI shell for Souffle, without Tauri"
authors = ["Damien Goehrig"]
license = "GPL-3.0-or-later"
edition = "2024"

[[bin]]
name = "souffle-slint"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
slint = "1.9"

[build-dependencies]
slint-build = "1.9"
