name: Contracts

on:
  push:
    branches:
      - develop
      - master
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - run: ./scripts/build-mcp-sidecar.test.sh
      - run: ./scripts/build-mcp-sidecar.sh --debug
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
        timeout-minutes: 15
