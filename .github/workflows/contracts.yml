name: Contracts

on:
  push:
    branches:
      - develop
      - master
  pull_request:
  merge_group:

# A new push to a PR makes the in-flight run obsolete; don't pay for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-contracts:
    runs-on: macos-latest
    # The job normally finishes in ~13 min. Without a cap, a hung step runs to
    # GitHub's 6 h default, and macOS minutes bill at 10x: one stuck run costs
    # more than a month of green ones.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6.0.1

      - uses: dtolnay/rust-toolchain@stable

      # Only the default branch writes the cache. GitHub scopes a cache to the
      # ref that created it, and a run can read only its own ref, its base, and
      # the default branch: never a sibling. Saving from PR runs therefore piled
      # up ~1 GB entries per PR that no other run could reach, against a 10 GB
      # repo-wide budget that GitHub reclaims by evicting the least recently
      # used entry.
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci
      # Cheap: cargo metadata honors CARGO_TARGET_DIR (no release build).
      - run: ./scripts/build-mcp-sidecar.test.sh
      # Tauri's build script validates `externalBin` entries during `cargo test`,
      # so the MCP sidecar must exist before type export (same as release builds).
      - run: ./scripts/build-mcp-sidecar.sh
      - run: npm run check:generated-types
      # Two PRs can each be green and still break develop together: one turned
      # a &str into a String while the other added a caller. Only the merged
      # tree catches that, so run the suites here as well as locally.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      # Silero's two ort tests have hung here indefinitely: whichever thread
      # wins the `Once` in `ensure_ort_initialized` can stall inside
      # `ort::init_from`, and every other thread then blocks on that `Once`
      # with no timeout. Fail the step instead of holding the runner.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
        timeout-minutes: 15
      - run: npm test
      - run: npm run check
