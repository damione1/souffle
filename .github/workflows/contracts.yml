name: Contracts

on:
  push:
    branches:
      - develop
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

# Checkout-only workflow: pin the GITHUB_TOKEN down instead of inheriting
# the default scope (same convention as release.yml / deploy-site.yml).
permissions:
  contents: read

# Superseded PR/push runs are obsolete. Keep a manually requested full run
# independent from the quick run triggered by a push to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    # Aim for five minutes, including a cold cache. A timeout is a failure,
    # never a substitute for completing the checks within this budget.
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: app -> target
          shared-key: quick
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - run: cargo fmt --manifest-path app/Cargo.toml --all -- --check
      - run: ./scripts/build-mcp-sidecar.test.sh
      # These crates exercise SQL contracts, paragraph grouping, MCP queries,
      # bundled fonts and UI typography without compiling Slint/Metal/audio.
      - name: Clippy (portable crates)
        run: cargo clippy --locked --manifest-path app/Cargo.toml -p souffle-schema -p souffle-mcp -p souffle-typography --all-targets -- -D warnings
      - name: Tests (portable crates)
        run: cargo test --locked --manifest-path app/Cargo.toml -p souffle-schema -p souffle-mcp -p souffle-typography

  native:
    name: Full native checks
    # Daily PRs into develop use Quick checks. Compile and test the whole app
    # before promotion to master, or explicitly via Run workflow on any ref.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.base_ref == 'master' ||
      github.ref == 'refs/heads/master' ||
      github.event.merge_group.base_ref == 'refs/heads/master'
    runs-on: macos-latest
    # Cold native builds have exceeded 50 minutes before tests even started.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # master seeds promotion PRs; a manual run on develop can seed any PR.
      # Do not save large caches scoped to individual PR merge refs.
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: app -> target
          # Preserve the previous job's cache namespace after renaming it.
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' }}

      # Slint's build script no longer needs a prebuilt Tauri sidecar.
      # The workspace commands already compile and test souffle-mcp.
      - run: cargo clippy --locked --manifest-path app/Cargo.toml --workspace --all-targets -- -D warnings
      # Silero's two ort tests have hung here (SOU-132). The tests now share a
      # single bounded ort init and fail by name after 30 s; the watchdog is
      # the next net: past 5 min it saves `sample` stacks of the test binaries
      # as an artifact before killing them. The 15 min cap stays as the last
      # net. Compile first so neither deadline counts build time.
      - run: cargo test --locked --manifest-path app/Cargo.toml --workspace --no-run
      - run: ./scripts/ci/cargo-test-watchdog.sh 300 "${RUNNER_TEMP}/cargo-test-samples" -- --locked --manifest-path app/Cargo.toml --workspace
        timeout-minutes: 15
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-samples
          path: ${{ runner.temp }}/cargo-test-samples
          if-no-files-found: ignore
      # The catalogue gate extracts the @tr() calls before validating both PO
      # files. Keep the extractor aligned with the Slint compiler in Cargo.lock.
      - name: Install matching translation extractor
        run: |
          version=$(awk '/^name = "slint"$/ { found = 1; next } found && /^version = / { gsub(/"/, "", $3); print $3; exit }' app/Cargo.lock)
          test -n "$version"
          cargo install slint-tr-extractor --version "$version" --locked
      - run: ./scripts/check_slint_translations.sh
