name: Release

# Builds the macOS installer on every version tag and attaches it to a GitHub Release.
#   git tag v0.1.0 && git push origin v0.1.0
#
# macOS Apple Silicon only, single leg (aarch64-apple-darwin). Souffle has no
# other target: Metal inference (candle, whisper.cpp) and Core Audio process
# taps are Apple Silicon only, and the bundled resources/libonnxruntime.dylib
# is an arm64 build. There is no Intel mac, Windows, Linux, or mobile leg.
#
# Apple Intelligence: release builds on macos-26 (GA since 2026-02-26) link the
# real FoundationModels bridge via Xcode 26. The bridge is statically linked
# into the binary during build; no separate dylib ships in the bundle.
#
# Signing + notarization are optional: the six APPLE_* secrets listed below
# already exist in this repo. Without them the build still works, it just
# ships unsigned. SOU-192: bundling, signing, notarization, and DMG creation
# are scripts/bundle-macos.sh (no tauri-bundler/tauri-action).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Create the draft release exactly once, up front, and let the build job
  # upload into it by id. This avoids a race where the job creates its own
  # release draft on top of a concurrent one.
  # ---------------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create draft release
        id: create
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const footer = [
              'Download the .dmg below for Apple Silicon Macs.',
              '',
              'Requires macOS 13 or newer on Apple Silicon (M1 or newer).',
            ].join('\n');

            // Hand-written notes live in the annotated tag message (see
            // CLAUDE.md, "Release changelogs"). Use them as the release body
            // when present; a lightweight or empty-message tag falls back to
            // GitHub's auto-generated notes (merged PR titles, structured by
            // .github/release.yml) so no release ever ships without notes.
            let notes = '';
            try {
              const { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              if (ref.object.type === 'tag') {
                const { data: tagObj } = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: ref.object.sha,
                });
                notes = (tagObj.message ?? '')
                  .replace(/-----BEGIN (PGP|SSH) SIGNATURE-----[\s\S]*$/, '')
                  .trim();
                // Drop a leading title line that just repeats the release
                // name (the common `git tag -a` habit) to avoid duplication.
                const lines = notes.split('\n');
                if (/^(Soufflé\s+)?v?\d+\.\d+\.\d+$/.test(lines[0]?.trim() ?? '')) {
                  notes = lines.slice(1).join('\n').trim();
                }
              }
            } catch (e) {
              core.warning(`Could not read tag annotation: ${e.message}`);
            }

            // With generate_release_notes, GitHub appends its generated
            // "What's Changed" section after the provided body, so
            // hand-written notes are never overwritten either way.
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Soufflé ${tag}`,
              body: notes ? `${notes}\n\n---\n\n${footer}` : `${footer}\n`,
              generate_release_notes: notes === '',
              draft: true,
              prerelease: false,
            });
            return data.id;

  # ---------------------------------------------------------------------------
  # macOS (Apple Silicon): builds the signed/notarized .dmg and uploads it,
  # plus the signed update artifact, into the draft release created above.
  # ---------------------------------------------------------------------------
  desktop:
    needs: create-release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # cmake builds the sentencepiece tokenizer; it's preinstalled on
      # GitHub's macOS runner images, so no separate setup step is needed.

      # Restore only. GitHub never lets one tag read another tag's cache, and
      # this job only ever runs on tags, so the ~900 MB it used to save was
      # unreachable to every later release while still counting against the
      # 10 GB repo budget. Restoring is kept because a hit on the default
      # branch's entry is still possible and costs nothing when it misses.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: "./app -> target"
          save-if: false

      - name: Install minisign
        run: brew install minisign

      - name: Set app version from tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export VERSION="${TAG#v}"
          sed -i '' "s/^version = .*/version = \"$VERSION\"/" app/Cargo.toml
          echo "App version set to $VERSION in Cargo.toml"
        # The app version comes from app/Cargo.toml [package] version.
        # We patch it from the tag here so the tag is the single source of truth
        # for the release. The build reads this via env!("CARGO_PKG_VERSION").

      - name: Import signing certificate
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="build.keychain"
          security create-keychain -p "" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          rm -f /tmp/cert.p12

      - name: Build, sign, notarize, and package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          notarize_flag=()
          if [[ -n "${APPLE_ID:-}" ]]; then
            notarize_flag=(--notarize)
          fi
          ./scripts/bundle-macos.sh --dmg --sign-updater "${notarize_flag[@]}"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "app/target/release/bundle/dmg/Soufflé.dmg" \
            "app/target/release/bundle/updater/"*.tar.gz \
            "app/target/release/bundle/updater/"*.tar.gz.sig \
            "app/target/release/bundle/updater/latest.json" \
            --clobber
