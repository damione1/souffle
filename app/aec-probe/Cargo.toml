[package]
name = "souffle-aec-probe"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
souffle = { path = ".." }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
hound = "3.5"
sha2 = "0.10"
unicode-normalization = "0.1"
cpal = "0.17"
ringbuf = "0.5"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioEngine", "AVAudioIONode", "AVAudioNode", "AVAudioSourceNode", "AVAudioFormat", "AVAudioBuffer", "AVAudioTime", "AVAudioTypes", "block2", "objc2-core-audio-types", "objc2-audio-toolbox"] }
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "AUComponent", "AudioComponent", "AudioUnitProperties"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
